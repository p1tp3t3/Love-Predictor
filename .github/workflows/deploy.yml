name: Deploy to GitHub Container Registry

on:
  # Deploy automatically after the CI workflow passes on main
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  # Or deploy by hand from the Actions tab
  workflow_dispatch:

# Never run two deploys at the same time
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and publish Docker image
    # Skip the deploy when CI failed
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # GITHUB_TOKEN only needs to read the code and publish packages
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out the code
        uses: actions/checkout@v4
        with:
          # Deploy exactly the commit that passed CI
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Work out image name and tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          # Becomes ghcr.io/<owner>/<repo> in lowercase
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,format=short,prefix=
          labels: |
            org.opencontainers.image.title=Love Predictor
            org.opencontainers.image.description=Predicts your chance of finding love and gives AI-written tips to boost it

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push the image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Reuse layers from earlier builds, so a code-only change doesn't reinstall PyTorch
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Show how to run it
        run: |
          image="ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]'):latest"
          {
            echo "### Published 🎉"
            echo
            echo "Run the app with:"
            echo
            echo '```bash'
            echo "docker run -p 5001:5001 $image"
            echo '```'
            echo
            echo "Then open http://localhost:5001"
          } >> "$GITHUB_STEP_SUMMARY"
